<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Inventário Lenha</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inventário Lenha">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="img/icone-180.png">
<link rel="icon" href="img/icone-192.png">
<style>
  :root { --azul:#1f3a5f; --verde:#1e8e3e; --vermelho:#d93025; --laranja:#e37400; --cinza:#f1f3f4; --texto:#202124; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#fff; color:var(--texto); font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif; }
  body { overscroll-behavior:none; }
  .tela { display:none; min-height:100%; padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); flex-direction:column; gap:14px; }
  .tela.ativa { display:flex; }
  .logo { width:62%; max-width:300px; align-self:center; margin:12px 0 4px; }
  h1 { margin:0; text-align:center; font-size:26px; color:var(--azul); }
  .sub { text-align:center; color:#5f6368; margin:0; font-size:15px; }
  input { font-size:22px; padding:14px; border:2px solid #dadce0; border-radius:12px; width:100%; }
  .btn { border:0; border-radius:16px; font-size:22px; font-weight:700; padding:20px; color:#fff; background:var(--azul); width:100%; }
  .btn:active { transform:scale(.98); opacity:.9; }
  .btn.verde { background:var(--verde); } .btn.vermelho { background:var(--vermelho); } .btn.cinza { background:var(--cinza); color:var(--texto); }
  .btn.gigante { font-size:30px; padding:30px; }
  .btn:disabled { opacity:.35; }
  .contador { text-align:center; font-size:64px; font-weight:800; color:var(--azul); line-height:1; }
  .contador small { display:block; font-size:16px; font-weight:500; color:#5f6368; margin-top:6px; }
  .info { background:var(--cinza); border-radius:12px; padding:12px 14px; font-size:15px; line-height:1.4; }
  .espaco { flex:1; }
  .barra { height:22px; background:var(--cinza); border-radius:8px; overflow:hidden; }
  .barra > div { height:100%; width:0; background:var(--verde); transition:width .2s; }
  /* camera */
  #telaCamera { padding:0; background:#000; position:fixed; inset:0; }
  #video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .15s; }
  #flash.on { opacity:.6; transition:none; }
  #instalar { background:#fef7e0; border:1px solid #f9ab00; }
  #resultado { position:absolute; left:12px; right:12px; top:calc(60px + env(safe-area-inset-top)); text-align:center; color:#fff; font-size:44px; font-weight:800; border-radius:14px; padding:8px; display:none; }
  #resultado.ok { display:block; background:rgba(30,142,62,.9); }
  #resultado.lendo { display:block; background:rgba(0,0,0,.6); font-size:24px; }
  #alerta { position:absolute; left:12px; right:12px; top:calc(60px + env(safe-area-inset-top)); background:var(--vermelho); color:#fff; display:none; flex-direction:column; align-items:center; text-align:center; gap:4px; z-index:5; border-radius:14px; padding:10px; pointer-events:none; }
  #alerta.mostra { display:flex; }
  #alerta b { font-size:34px; } #alerta span { font-size:26px; }
  .rodape { position:absolute; left:0; right:0; bottom:0; padding:16px 16px calc(20px + env(safe-area-inset-bottom)); display:flex; align-items:center; justify-content:space-between; }
  #disparo { flex-shrink:0; width:86px; height:86px; border-radius:50%; border:6px solid #fff; background:rgba(255,255,255,.35); }
  #disparo:active { background:#fff; }
  .mini { color:#fff; background:rgba(0,0,0,.5); border:0; border-radius:12px; font-size:17px; padding:12px 14px; min-width:96px; }
  #contaCam { color:#fff; font-size:20px; font-weight:700; min-width:60px; text-align:center; }
  /* digitar */
  #digitar { position:absolute; inset:0; background:#fff; z-index:6; display:none; flex-direction:column; padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); gap:12px; }
  #digitar.mostra { display:flex; }
  #digitar img { width:100%; max-height:28vh; object-fit:contain; border-radius:10px; background:#000; }
  .linha { display:flex; gap:10px; } .linha input { text-align:center; font-size:34px; font-weight:800; }
  /* lista */
  #lista { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .foto { position:relative; border-radius:10px; overflow:hidden; border:3px solid transparent; }
  .foto img { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; background:#ddd; }
  .foto.marcada { border-color:#d93025; }
  .foto.marcada::after { content:'✓'; position:absolute; top:6px; right:6px; width:30px; height:30px; border-radius:50%; background:#d93025; color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .mini2 { flex:1; border:0; border-radius:12px; font-size:17px; font-weight:700; padding:14px 8px; background:var(--cinza); color:var(--texto); }
  .mini2.verm { background:var(--vermelho); color:#fff; } .mini2:disabled { opacity:.4; }
  .item { display:flex; align-items:center; gap:10px; padding:8px; border-bottom:1px solid #eee; }
  .item img { width:160px; height:90px; object-fit:cover; border-radius:6px; background:#ddd; }
  .item b { font-size:22px; min-width:96px; } .item .tag { font-size:13px; padding:2px 8px; border-radius:10px; background:var(--cinza); }
  .tag.rep { background:#fce8e6; color:var(--vermelho); } .tag.man { background:#fef7e0; color:var(--laranja); }
</style>
</head>
<body>

<!-- 1. Primeira vez: nome -->
<section id="telaNome" class="tela">
  <img class="logo" src="img/logo.png" alt="Minerva Foods">
  <h1>Inventário Lenha</h1>
  <p class="sub">Digite seu nome para começar</p>
  <input id="campoNome" autocomplete="name" placeholder="Seu nome">
  <button class="btn" id="salvarNome">Entrar</button>
</section>

<!-- 2. Inicio -->
<section id="telaInicio" class="tela">
  <img class="logo" src="img/logo.png" alt="Minerva Foods">
  <h1>Inventário Lenha</h1>
  <p class="sub" id="ola"></p>
  <div class="contador"><span id="total">0</span><small>fotos tiradas</small></div>
  <button class="btn gigante" id="abrirCamera">📷 CONTAR</button>
  <button class="btn cinza" id="btnGaleria">🖼️ Trazer fotos da galeria</button>
  <input type="file" id="galeria" accept="image/*" multiple hidden>
  <button class="btn verde" id="enviar">Enviar fotos</button>
  <div class="barra" id="barra" hidden><div></div></div>
  <div class="info" id="situacao"></div>
  <div class="espaco"></div>
  <button class="btn cinza" id="verLista">🖼️ Ver fotos</button>
  <button class="btn vermelho" id="apagar" disabled>🗑 Apagar todas as fotos</button>
  <p class="sub" style="font-size:12px">versão 27</p>
</section>

<!-- 3. Camera -->
<section id="telaCamera" class="tela">
  <video id="video" playsinline muted autoplay></video>
  <div id="flash"></div>
  <div id="resultado"></div>
  <button class="mini" id="lanterna" hidden style="position:absolute;right:12px;bottom:calc(130px + env(safe-area-inset-bottom))">🔦 Lanterna</button>
  <div id="zooms" hidden style="position:absolute;left:0;right:0;bottom:calc(185px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px"></div>
  <div id="alerta"><b>JÁ CONTADO</b><span id="alertaTxt"></span></div>
  <button class="mini" id="fecharCamera" style="position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top))">‹ Voltar</button>
  <div class="rodape">
    <div style="position:relative;width:90px;height:150px;border-radius:12px;overflow:hidden;border:3px solid #fff;background:rgba(255,255,255,.15);flex-shrink:0"><img id="miniatura" alt="" style="position:absolute;left:50%;top:50%;width:150px;height:90px;object-fit:cover;transform:translate(-50%,-50%) rotate(90deg)"></div>
    <button id="disparo" aria-label="Tirar foto"></button>
    <div id="contaCam">0</div>
  </div>
</section>

<!-- 4. Lista -->
<section id="telaLista" class="tela">
  <h1>Fotos</h1>
  <p class="sub" id="resumoLista"></p>
  <div style="display:flex;gap:8px;position:sticky;top:0;background:#fff;padding:6px 0;z-index:3">
    <button class="mini2" id="selecionar">Selecionar</button>
    <button class="mini2" id="tudo" hidden>Selecionar tudo</button>
    <button class="mini2 verm" id="apagarSel" hidden>🗑 Apagar (0)</button>
  </div>
  <div id="lista"></div>
  <button class="btn cinza" id="maisFotos" hidden>Mostrar mais</button>
  <button class="btn cinza" id="voltarLista">Voltar</button>
</section>

  <div id="verFoto" style="position:fixed;inset:0;background:#000;display:none;z-index:20;align-items:center;justify-content:center">
    <img id="fotoGrande" alt="" style="width:100%;height:100%;object-fit:contain">
    <span style="position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));color:#fff;font-size:17px">Toque para voltar</span>
  </div>
<input type="file" id="arquivoTeste" accept="image/*" hidden>
<script src="app.js"></script>
</body>
</html>
