<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventário Lenha</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inventário Lenha">
<link rel="apple-touch-icon" href="img/icone-180.png">
<link rel="icon" href="img/icone-192.png">
<style>
  :root { --azul:#1f3a5f; --verde:#1e8e3e; --cinza:#f1f3f4; --texto:#202124; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; background:#fff; color:var(--texto); font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif; }
  .tela { display:none; padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); flex-direction:column; gap:16px; }
  .tela.ativa { display:flex; }
  .logo { width:62%; max-width:300px; align-self:center; margin:12px 0 4px; }
  h1 { margin:0; text-align:center; font-size:26px; color:var(--azul); }
  .sub { text-align:center; color:#5f6368; margin:0; font-size:15px; }
  input[type=text] { font-size:22px; padding:14px; border:2px solid #dadce0; border-radius:12px; width:100%; }
  .btn { border:0; border-radius:16px; font-size:24px; font-weight:700; padding:28px 20px; color:#fff; background:var(--verde); width:100%; }
  .btn.azul { background:var(--azul); font-size:22px; padding:20px; }
  .btn:active { transform:scale(.98); opacity:.9; }
  .btn:disabled { opacity:.35; }
  .info { background:var(--cinza); border-radius:12px; padding:12px 14px; font-size:16px; line-height:1.4; text-align:center; }
  #instalar { background:#fef7e0; border:1px solid #f9ab00; text-align:left; }
  .barra { height:16px; background:var(--cinza); border-radius:8px; overflow:hidden; }
  .barra > div { height:100%; width:0; background:var(--verde); transition:width .2s; }
</style>
</head>
<body>
<section id="telaNome" class="tela">
  <img class="logo" src="img/logo.png" alt="Minerva Foods">
  <h1>Inventário Lenha</h1>
  <p class="sub">Digite seu nome para começar</p>
  <input type="text" id="campoNome" autocomplete="name" placeholder="Seu nome">
  <button class="btn azul" id="salvarNome">Entrar</button>
</section>

<section id="telaInicio" class="tela">
  <img class="logo" src="img/logo.png" alt="Minerva Foods">
  <h1>Inventário Lenha</h1>
  <p class="sub" id="ola"></p>
  <button class="btn" id="escolher">📤 Enviar fotos da galeria</button>
  <input type="file" id="galeria" accept="image/*" multiple hidden>
  <div class="barra" id="barra" hidden><div></div></div>
  <div class="info" id="situacao">Tire as fotos com a câmera do celular. Depois toque no botão verde e escolha as fotos.</div>
  <p class="sub" style="font-size:12px">versão 16</p>
</section>
<script src="app.js"></script>
</body>
</html>
